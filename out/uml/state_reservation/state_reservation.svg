<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="STATE" style="width:1571px;height:803px;background:#FFFFFF;" width="1571px" height="803px" viewBox="0 0 1571 803" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.9beta4?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><g class="title" data-source-line="1"><text x="540.607" y="22.995" fill="#000" font-size="14" textLength="483.424" font-weight="700">Increment 5 - Reservation State Diagram (Approved Policies)</text></g><g class="start_entity" data-qualified-name=".start." id="ent0001" data-source-line="5"><ellipse cx="840.41" cy="53.297" rx="10" ry="10" fill="#222" style="stroke:#222;stroke-width:1;"/></g><rect x="807.17" y="163.127" width="66.465" height="40" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="812.17" y="187.974" fill="#000" font-size="14" textLength="56.465">Pending</text><rect x="296.94" y="333.227" width="82.926" height="40" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="301.94" y="358.074" fill="#000" font-size="14" textLength="72.926">Confirmed</text><rect x="1164.83" y="418.497" width="63.163" height="40" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="1169.83" y="443.344" fill="#000" font-size="14" textLength="53.163">Expired</text><rect x="754" y="496.197" width="78.817" height="40" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="759" y="521.044" fill="#000" font-size="14" textLength="68.817">Cancelled</text><rect x="459.62" y="496.197" width="83.568" height="40" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="464.62" y="521.044" fill="#000" font-size="14" textLength="73.568">CheckedIn</text><rect x="547.43" y="643.727" width="95.948" height="40" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="552.43" y="668.574" fill="#000" font-size="14" textLength="85.948">CheckedOut</text><rect x="7" y="496.197" width="66.813" height="40" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="12" y="521.044" fill="#000" font-size="14" textLength="56.813">NoShow</text><g class="end_entity" data-qualified-name=".end." id="ent0018" data-source-line="17"><ellipse cx="695.41" cy="778.557" rx="11" ry="11" fill="none" style="stroke:#222;stroke-width:1;"/><ellipse cx="695.41" cy="778.557" rx="6" ry="6" fill="#222" style="stroke:#222;stroke-width:1;"/></g><g class="entity" data-qualified-name="GMN23" id="ent0024" data-source-line="23"><path d="M1216.18,140.297 L1216.18,179.127 L874,183.127 L1216.18,187.127 L1216.18,225.961 A0,0 0 0 0 1216.18,225.961 L1556.638,225.961 A0,0 0 0 0 1556.638,225.961 L1556.638,150.297 L1546.638,140.297 L1216.18,140.297 A0,0 0 0 0 1216.18,140.297" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M1546.638,140.297 L1546.638,150.297 L1556.638,150.297 L1546.638,140.297" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="1222.18" y="157.364" fill="#000" font-size="13" textLength="272.143">This is a persisted temporary reservation.</text><text x="1222.18" y="172.497" fill="#000" font-size="13" textLength="319.458">Holds room-type inventory, NOT a room number.</text><text x="1222.18" y="187.629" fill="#000" font-size="13" textLength="301.279">expiresAt = server creation time + 5 minutes.</text><text x="1222.18" y="202.762" fill="#000" font-size="13" textLength="284.273">Payment retries never extend the deadline.</text><text x="1222.18" y="217.895" fill="#000" font-size="13" textLength="290.253">A failed payment does not change the state.</text></g><g class="entity" data-qualified-name="GMN26" id="ent0027" data-source-line="31"><path d="M415.1,317.967 L415.1,349.227 L380.37,353.227 L415.1,357.227 L415.1,388.498 A0,0 0 0 0 415.1,388.498 L723.712,388.498 A0,0 0 0 0 723.712,388.498 L723.712,327.967 L713.712,317.967 L415.1,317.967 A0,0 0 0 0 415.1,317.967" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M713.712,317.967 L713.712,327.967 L723.712,327.967 L713.712,317.967" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="421.1" y="335.034" fill="#000" font-size="13" textLength="263.18">Requires successful simulated payment,</text><text x="421.1" y="350.167" fill="#000" font-size="13" textLength="287.612">valid unexpired hold, and database commit.</text><text x="421.1" y="365.299" fill="#000" font-size="13" textLength="282.35">Booking reference and random secret code</text><text x="421.1" y="380.432" fill="#000" font-size="13" textLength="263.599">are issued; only the code hash is stored.</text></g><g class="entity" data-qualified-name="GMN29" id="ent0030" data-source-line="38"><path d="M799.77,620.897 L799.77,706.561 A0,0 0 0 0 799.77,706.561 L1123.045,706.561 A0,0 0 0 0 1123.045,706.561 L1123.045,630.897 L1113.045,620.897 L916.78,620.897 L815.72,536.517 L908.78,620.897 L799.77,620.897 A0,0 0 0 0 799.77,620.897" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M1113.045,620.897 L1113.045,630.897 L1123.045,630.897 L1113.045,620.897" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="805.77" y="637.964" fill="#000" font-size="13" textLength="279.189">Confirmed booking: cancellation permitted</text><text x="805.77" y="653.097" fill="#000" font-size="13" textLength="295.299">before scheduled check-in (14:00 local time).</text><text x="805.77" y="668.229" fill="#000" font-size="13" textLength="294.334">>= 24 hours before: 100% simulated refund.</text><text x="805.77" y="683.362" fill="#000" font-size="13" textLength="194.124">&lt; 24 hours before: no refund.</text><text x="805.77" y="698.495" fill="#000" font-size="13" textLength="302.275">Pending cancellation simply releases the hold.</text></g><g class="entity" data-qualified-name="GMN32" id="ent0033" data-source-line="46"><path d="M108.63,488.497 L108.63,512.197 L73.95,516.197 L108.63,520.197 L108.63,543.895 A0,0 0 0 0 108.63,543.895 L424.193,543.895 A0,0 0 0 0 424.193,543.895 L424.193,498.497 L414.193,488.497 L108.63,488.497 A0,0 0 0 0 108.63,488.497" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M414.193,488.497 L414.193,498.497 L424.193,498.497 L414.193,488.497" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="114.63" y="505.564" fill="#000" font-size="13" textLength="265.77">No show if not checked in by 12:00 noon</text><text x="114.63" y="520.697" fill="#000" font-size="13" textLength="255.918">the following day; no simulated refund.</text><text x="114.63" y="535.829" fill="#000" font-size="13" textLength="294.563">Release capacity for remaining future nights.</text></g><!--link *start* to Pending--><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" id="lnk3" data-source-line="5" data-link-type="dependency"><path d="M840.41,63.497 C840.41,84.217 840.41,129.937 840.41,157.887" style="stroke:#181818;stroke-width:1;" fill="none" id="*start*-to-Pending"/><polygon points="840.41,162.887,844.41,153.887,840.41,157.887,836.41,153.887,840.41,162.887" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="841.41" y="106.364" fill="#000" font-size="13" textLength="292.322">Valid request / atomic 5-minute hold created</text></g><!--link Pending to Pending--><g class="link" data-entity-1="ent0002" data-entity-2="ent0002" id="lnk4" data-source-line="7" data-link-type="dependency"><path d="M874.11,168.507 C892.18,166.027 908.64,170.897 908.64,183.127 C908.64,195.367 897.133,200.919 879.063,198.429" style="stroke:#181818;stroke-width:1;" fill="none" id="Pending-to-Pending"/><polygon points="874.11,197.747,882.48,202.938,879.063,198.429,883.572,195.013,874.11,197.747" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="914.64" y="187.694" fill="#000" font-size="13" textLength="278.008">Payment fails / retry until original deadline</text></g><!--link Pending to Confirmed--><g class="link" data-entity-1="ent0002" data-entity-2="ent0005" id="lnk6" data-source-line="8" data-link-type="dependency"><path d="M807.06,189.177 C748.8,198.547 625.17,220.937 525.41,255.967 C465.76,276.907 453.22,288.287 397.41,317.967 C388.73,322.577 383.796,325.299 375.256,330.249" style="stroke:#181818;stroke-width:1;" fill="none" id="Pending-to-Confirmed"/><polygon points="370.93,332.757,380.722,331.704,375.256,330.249,376.711,324.783,370.93,332.757" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="574.033" y="269.034" fill="#000" font-size="13" textLength="192.194">Simulated payment succeeds</text><text x="526.41" y="284.167" fill="#000" font-size="13" textLength="287.441">[before expiresAt and DB commit succeeds]</text></g><!--link Pending to Expired--><g class="link" data-entity-1="ent0002" data-entity-2="ent0007" id="lnk8" data-source-line="9" data-link-type="dependency"><path d="M874.04,188.867 C938.56,199.717 1080.24,232.377 1158.41,317.967 C1184.25,346.257 1192.011,387.173 1194.661,413.083" style="stroke:#181818;stroke-width:1;" fill="none" id="Pending-to-Expired"/><polygon points="1195.17,418.057,1198.234,408.697,1194.661,413.083,1190.275,409.511,1195.17,418.057" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="1124.41" y="276.534" fill="#000" font-size="13" textLength="277.107">now >= expiresAt / release held inventory</text></g><!--link Pending to Cancelled--><g class="link" data-entity-1="ent0002" data-entity-2="ent0009" id="lnk10" data-source-line="10" data-link-type="dependency"><path d="M841.05,203.447 C842.09,248.767 842.01,365.147 818.41,458.497 C815.14,471.427 811.388,480.656 806.098,491.346" style="stroke:#181818;stroke-width:1;" fill="none" id="Pending-to-Cancelled"/><polygon points="803.88,495.827,811.457,489.535,806.098,491.346,804.287,485.986,803.88,495.827" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="840.41" y="357.794" fill="#000" font-size="13" textLength="308.223">Guest explicitly cancels payment / release hold</text></g><!--link Confirmed to CheckedIn--><g class="link" data-entity-1="ent0005" data-entity-2="ent0011" id="lnk12" data-source-line="12" data-link-type="dependency"><path d="M316.84,373.457 C294.57,395.627 265.88,432.367 287.41,458.497 C331.75,512.307 374.91,467.517 441.41,488.497 C447.93,490.557 450.072,491.2 456.602,493.91" style="stroke:#181818;stroke-width:1;" fill="none" id="Confirmed-to-CheckedIn"/><polygon points="461.22,495.827,454.441,488.683,456.602,493.91,451.374,496.072,461.22,495.827" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="309.335" y="435.564" fill="#000" font-size="13" textLength="186.285">Receptionist verifies identity</text><text x="288.41" y="450.697" fill="#000" font-size="13" textLength="228.135">and assigns suitable physical room</text></g><!--link CheckedIn to CheckedOut--><g class="link" data-entity-1="ent0011" data-entity-2="ent0013" id="lnk14" data-source-line="13" data-link-type="dependency"><path d="M495.7,536.437 C492.21,551.977 489.88,573.967 498.41,590.897 C510,613.907 528.524,628.889 549.134,640.839" style="stroke:#181818;stroke-width:1;" fill="none" id="CheckedIn-to-CheckedOut"/><polygon points="553.46,643.347,547.68,635.372,549.134,640.839,543.668,642.293,553.46,643.347" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="499.41" y="586.964" fill="#000" font-size="13" textLength="220.613">Receptionist completes check-out</text></g><!--link Confirmed to Cancelled--><g class="link" data-entity-1="ent0005" data-entity-2="ent0009" id="lnk15" data-source-line="14" data-link-type="dependency"><path d="M367.87,373.577 C377.06,378.987 387.4,384.477 397.41,388.497 C450.03,409.617 472.71,389.457 521.41,418.497 C541.95,430.747 536.85,446.257 557.41,458.497 C619.51,495.457 699.341,507.884 748.561,512.364" style="stroke:#181818;stroke-width:1;" fill="none" id="Confirmed-to-Cancelled"/><polygon points="753.54,512.817,744.94,508.018,748.561,512.364,744.214,515.985,753.54,512.817" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="568.811" y="435.564" fill="#000" font-size="13" textLength="234.876">Eligible cancellation before check-in</text><text x="558.41" y="450.697" fill="#000" font-size="13" textLength="255.677">/ release inventory; apply refund policy</text></g><!--link Confirmed to NoShow--><g class="link" data-entity-1="ent0005" data-entity-2="ent0016" id="lnk17" data-source-line="15" data-link-type="dependency"><path d="M296.69,358.547 C227.87,366.517 94.94,385.797 62.41,418.497 C42.01,438.997 38.846,469.237 39.126,491.037" style="stroke:#181818;stroke-width:1;" fill="none" id="Confirmed-to-NoShow"/><polygon points="39.19,496.037,43.074,486.986,39.126,491.037,35.075,487.089,39.19,496.037" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="87.004" y="435.564" fill="#000" font-size="13" textLength="161.542">No arrival by 12:00 noon</text><text x="63.41" y="450.697" fill="#000" font-size="13" textLength="208.73">on day after scheduled check-in</text></g><!--link Expired to *end*--><g class="link" data-entity-1="ent0007" data-entity-2="ent0018" id="lnk19" data-source-line="17" data-link-type="dependency"><path d="M1198.96,458.737 C1204.3,507.977 1210.89,639.407 1140.41,706.557 C1075.41,768.477 774.309,776.358 711.639,777.348" style="stroke:#181818;stroke-width:1;" fill="none" id="Expired-to-*end*"/><polygon points="706.64,777.427,715.702,781.284,711.639,777.348,715.576,773.285,706.64,777.427" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;strok